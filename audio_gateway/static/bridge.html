<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVM 会议音频</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background:#0e1116; color:#dbe4ee;
         max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:18px; font-weight:600; }
  .card { background:#161b22; border:1px solid #2a313a; border-radius:10px; padding:18px; margin-top:14px; }
  button { font-size:15px; padding:10px 22px; border-radius:8px; border:none; cursor:pointer; margin-right:10px; }
  #btnConn { background:#2ea043; color:#fff; }
  #btnConn.on { background:#8b949e; }
  #btnMute { background:#30363d; color:#dbe4ee; }
  #btnMute.muted { background:#d29922; color:#000; }
  #btnMute[hidden], #uplinkMeter[hidden] { display:none !important; }
  #btnVoice { background:#30363d; color:#dbe4ee; margin:12px 0 0; width:100%; }
  #btnVoice.on { background:#6e40c9; color:#fff; }
  .meter { height:14px; background:#0a0d12; border-radius:7px; overflow:hidden; margin:6px 0 14px; }
  .meter > div { height:100%; width:0%; background:linear-gradient(90deg,#2ea043,#d29922 80%,#f85149); transition:width .12s; }
  .lbl { font-size:13px; color:#8b949e; }
  #status { font-size:13px; color:#8b949e; margin-top:12px; white-space:pre-line; }
  .hint { font-size:12px; color:#6e7681; margin-top:16px; line-height:1.6; }
  label { font-size:13px; color:#8b949e; display:block; margin-top:10px; }
  #interpreter[hidden] { display:none; }
  .interpreter-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .interpreter-title { color:#d8b4fe; font-size:12px; font-weight:600; }
  #interpreterStatus { border:1px solid #6e7681; border-radius:999px; padding:2px 8px; font-size:11px; }
  #interpreterStatus.connected { border-color:#2ea043; color:#7ee787; }
  /* 双泳道：原文/译文两条独立流，宽屏左右分栏（中文主位占大头）、窄屏上下堆叠 */
  #subtitleStream { display:flex; gap:8px; margin-top:12px; }
  @media (max-width: 560px) { #subtitleStream { flex-direction:column; } }
  .lane { flex:1; min-width:0; max-height:320px; overflow-y:auto; padding:6px;
          border:1px solid #30363d; border-radius:8px; background:#0e1116; }
  #laneZh { flex:1.5; }
  .lane-title { color:#6e7681; font-size:11px; margin:2px 2px 6px; }
  .sentence-source { color:#8b949e; font-size:12px; line-height:1.5; white-space:pre-wrap; }
  .seg-time { color:#6e7681; font-size:10px; margin-right:4px; font-variant-numeric:tabular-nums; }
  .seg-zh { font-size:18px; font-weight:600; line-height:1.55; white-space:pre-wrap;
            padding:5px 2px; border-bottom:1px solid #21262d; }
  .seg-ja { color:#8b949e; font-size:12px; line-height:1.5; white-space:pre-wrap;
            padding:4px 2px; border-bottom:1px solid #21262d; }
  .seg-zh:last-child, .seg-ja:last-child { border-bottom:0; }
  .stream-foot { display:flex; justify-content:space-between; align-items:center; margin-top:7px;
                 color:#6e7681; font-size:11px; }
  #btnFollow { padding:4px 9px; margin:0; font-size:11px; background:#30363d; color:#dbe4ee; }
  #interpreterError { margin-top:8px; color:#d29922; font-size:11px; }
  #advisor[hidden] { display:none; }
  #adviceStream { max-height:260px; overflow-y:auto; margin-top:12px; }
  .advice { white-space:pre-wrap; border:1px solid #1f6f78; border-radius:8px; padding:10px;
            margin-top:8px; background:#0e1c20; font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<h1>🎧 KVM 会议音频面板</h1>
<div class="card">
  <button id="btnConn">连接</button>
  <!-- TASK-20260730-008 restore point: retained, but not rendered while uplink is mothballed. -->
  <button id="btnMute" disabled hidden>静音</button>
  <label><input type="checkbox" id="chkPlay"> 本页播放会议原声（默认关闭；通常由 Mac mini 本机 --monitor 播放）</label>
  <div style="margin-top:16px">
    <div class="lbl">⬇ 会议声音（被控机 → 网关）</div>
    <div class="meter"><div id="mDown"></div></div>
    <!-- Restore together with UPLINK_PRODUCT_ENTRY_ENABLED after channel promotion. -->
    <div id="uplinkMeter" hidden>
      <div class="lbl">⬆ 发言上行（mic-agent / 本页麦克风）</div>
      <div class="meter"><div id="mUp"></div></div>
    </div>
  </div>
  <div id="status">未连接</div>
</div>
<div class="card" id="interpreter" hidden aria-label="实时同传">
  <div class="interpreter-head">
    <div class="interpreter-title" id="interpreterTitle">实时同传</div>
    <div id="interpreterStatus">重连中</div>
  </div>
  <button id="btnVoice" disabled>译文语音：关（默认）</button>
  <!-- 双泳道：中文/日文是两条独立流，行与行不逐句对应，不做任何行级配对。 -->
  <div id="subtitleStream">
    <div class="lane" id="laneZh">
      <div class="lane-title">中文译文 · 同传延迟约 1-3 秒，与日文行不逐句对应</div>
      <div class="sentence-source">等待字幕…</div>
    </div>
    <div class="lane" id="laneJa">
      <div class="lane-title">日文原文</div>
      <div class="sentence-source">等待字幕…</div>
    </div>
  </div>
  <div class="stream-foot">
    <span id="historyCount">最近 0 句 · 自动跟随最新</span>
    <button id="btnFollow" hidden>回到最新</button>
  </div>
  <div id="interpreterError"></div>
</div>
<div class="card" id="advisor" hidden aria-label="会议参谋">
  <div class="interpreter-head">
    <div class="interpreter-title">会议参谋 · 只读日语原文</div>
    <div id="advisorBrief">内置通用 brief</div>
  </div>
  <div id="adviceStream"><div class="sentence-source">参谋已就位，等待值得提示的信息…</div></div>
</div>
<div class="hint">
  本页只展示 Mac mini 本机接收的会议音频、同传与参谋状态；本页播放默认关闭。<br>
  断线自动重连，远程桌面渠道不属于音频网关工程依赖。
</div>
<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
// TASK-20260730-008 restore point: all uplink capture/mute code and protocol stay
// below. Set true only after the remote channel supports direct microphone
// forwarding and the product acceptance/runbooks are promoted together.
const UPLINK_PRODUCT_ENTRY_ENABLED = false;
let ws = null, ctx = null, playerNode = null, capNode = null, micStream = null;
let serverMuted = false, micOk = false, wantConnected = false, retryTimer = null;
let serverVoice = false, voicePending = false, followLatest = true;
// 双泳道各自 60 上限（与服务端 SegmentHistory 一致）；主键是服务端全局单调 id。
let sourceSegments = [], zhSegments = [], advice = [];
let lastBridgeState = null;
let upFrames = 0, lastUpFrames = 0;

const PLAYER_JS = `
class Player extends AudioWorkletProcessor {
  constructor(){ super(); this.q=[]; this.qs=0; this.cur=null; this.off=0; this.started=false; this.pre=4096;
    this.port.onmessage = e => { const a = new Float32Array(e.data);
      this.q.push(a); this.qs += a.length;
      if (this.qs > 48000) { while (this.qs > 24000) { const d=this.q.shift(); this.qs-=d.length; } this.cur=null; this.off=0; }
    }; }
  process(_, outputs){ const out = outputs[0][0];
    if (!this.started) { if (this.qs < this.pre) { out.fill(0); return true; } this.started = true; }
    let i = 0;
    while (i < out.length) {
      if (!this.cur) { if (this.q.length === 0) break; this.cur = this.q.shift(); this.off = 0; }
      const take = Math.min(out.length - i, this.cur.length - this.off);
      out.set(this.cur.subarray(this.off, this.off + take), i);
      i += take; this.off += take; this.qs -= take;
      if (this.off === this.cur.length) this.cur = null;
    }
    if (i < out.length) { out.fill(0, i); this.started = false; }
    return true; } }
registerProcessor('player', Player);`;

const CAP_JS = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.buf = new Float32Array(960); this.n = 0; }
  process(inputs){ const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    let i = 0;
    while (i < ch.length) {
      const take = Math.min(ch.length - i, this.buf.length - this.n);
      this.buf.set(ch.subarray(i, i + take), this.n); this.n += take; i += take;
      if (this.n === this.buf.length) {
        const out = new Int16Array(this.buf.length);
        for (let j = 0; j < out.length; j++) { const s = Math.max(-1, Math.min(1, this.buf[j])); out[j] = (s * 32767) | 0; }
        this.port.postMessage(out.buffer, [out.buffer]); this.n = 0;
      } }
    return true; } }
registerProcessor('cap', Cap);`;

function meter(el, rms) {
  const db = 20 * Math.log10(Math.max(rms, 1e-6));
  el.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + "%";
}
function rmsInt16(i16) { let s = 0; for (let i = 0; i < i16.length; i += 4) { const v = i16[i] / 32768; s += v * v; } return Math.sqrt(s / (i16.length / 4)); }
function setStatus(t) { $("status").textContent = t; }
function renderMute() {
  if (!UPLINK_PRODUCT_ENTRY_ENABLED) return;
  $("btnMute").textContent = serverMuted ? "取消静音" : "静音";
  $("btnMute").classList.toggle("muted", serverMuted);
}
function summary() {
  if (!UPLINK_PRODUCT_ENTRY_ENABLED) return "✅ 已连接 | 接收侧";
  const mic = micOk ? (serverMuted ? "🔇 已静音" : "🎙 发言开启") : "本页无麦（收听/控制模式）";
  return `✅ 已连接 | ${mic}`;
}
function upsert(items, item, limit) {
  const next = items.filter(existing => existing.t !== item.t);
  next.push(item);
  next.sort((a, b) => a.t - b.t);
  return next.slice(-limit);
}
// 泳道主键是服务端全局单调 id；排序按到达序，绝不按 elapsed_ms（重连会归零）。
function upsertById(items, item, limit) {
  const next = items.filter(existing => existing.id !== item.id);
  next.push(item);
  next.sort((a, b) => a.id - b.id);
  return next.slice(-limit);
}
function renderFollowState() {
  const count = sourceSegments.length + zhSegments.length;
  $("historyCount").textContent = `最近 ${count} 句 · ${followLatest ? "自动跟随最新" : "已暂停跟随"}`;
  $("btnFollow").hidden = followLatest;
}
function fmtClock(seg) {
  // elapsed_ms 为 null（断线冲刷等）回退整场会议单调时间 t；仅用于显示。
  const seconds = seg.elapsed_ms !== null ? seg.elapsed_ms / 1000 : seg.t;
  const total = Math.max(0, Math.floor(seconds));
  return `[${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}]`;
}
function renderLane(lane, title, items, rowClass) {
  const previousBottomDistance = lane.scrollHeight - lane.scrollTop;
  lane.replaceChildren();
  const head = document.createElement("div");
  head.className = "lane-title";
  head.textContent = title;
  lane.append(head);
  if (!items.length) {
    const waiting = document.createElement("div");
    waiting.className = "sentence-source";
    waiting.textContent = "等待字幕…";
    lane.append(waiting);
  } else {
    for (const seg of items) {
      const row = document.createElement("div");
      row.className = rowClass;
      const time = document.createElement("span");
      time.className = "seg-time";
      time.textContent = fmtClock(seg);
      row.append(time, document.createTextNode(seg.text));
      lane.append(row);
    }
  }
  if (followLatest) {
    lane.scrollTop = lane.scrollHeight;
  } else {
    lane.scrollTop = Math.max(0, lane.scrollHeight - previousBottomDistance);
  }
}
function renderSegments() {
  renderLane($("laneZh"), "中文译文 · 同传延迟约 1-3 秒，与日文行不逐句对应", zhSegments, "seg-zh");
  renderLane($("laneJa"), "日文原文", sourceSegments, "seg-ja");
  renderFollowState();
}
function renderAdvice(state) {
  const info = state && state.advisor;
  const panel = $("advisor");
  if (!info || !info.enabled) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;
  $("advisorBrief").textContent = info.brief_source === "file"
    ? (info.brief_path || "~/AudioGateway/brief.md")
    : "内置通用 brief";
  const stream = $("adviceStream");
  stream.replaceChildren();
  if (!advice.length) {
    const waiting = document.createElement("div");
    waiting.className = "sentence-source";
    waiting.textContent = "参谋已就位，等待值得提示的信息…";
    stream.append(waiting);
    return;
  }
  for (const item of [...advice].reverse()) {
    const row = document.createElement("div");
    row.className = "advice";
    row.textContent = item.markdown;
    stream.append(row);
  }
}
function renderInterpreter(state) {
  const info = state && state.interpreter;
  const panel = $("interpreter");
  if (!info || !info.enabled) {
    panel.hidden = true;
    return;
  }
  panel.hidden = false;
  $("interpreterTitle").textContent = `实时同传 · ${info.lang || "zh"}`;
  $("interpreterStatus").textContent = info.gated
    ? "VAD 已暂停计费流"
    : (info.connected ? "已连接" : "重连中");
  $("interpreterStatus").classList.toggle("connected", !!info.connected);
  serverVoice = !!info.interpret_voice;
  voicePending = false;
  $("btnVoice").disabled = !ws || ws.readyState !== 1;
  $("btnVoice").textContent = `译文语音：${serverVoice ? "开" : "关（默认）"}`;
  $("btnVoice").classList.toggle("on", serverVoice);
  $("interpreterError").textContent = info.error || "";
}
function applySegment(item) {
  if (typeof item.id !== "number" || typeof item.text !== "string") return;
  if (item.stream !== "source" && item.stream !== "translation") return;
  const seg = {
    id: item.id,
    stream: item.stream,
    text: item.text,
    t: typeof item.t === "number" ? item.t : 0,
    elapsed_ms: typeof item.elapsed_ms === "number" ? item.elapsed_ms : null,
  };
  if (item.stream === "translation") zhSegments = upsertById(zhSegments, seg, 60);
  else sourceSegments = upsertById(sourceSegments, seg, 60);
  renderSegments();
}
function applyAdvice(item) {
  if (typeof item.t !== "number") return;
  const markdown = typeof item.markdown === "string"
    ? item.markdown
    : ["situation", "suggestion", "phrase", "risk"]
      .filter(key => typeof item[key] === "string")
      .map(key => `${key}: ${item[key]}`)
      .join("\n");
  if (!markdown) return;
  advice = upsert(advice, { type: "advice", t: item.t, markdown }, 10);
  if (lastBridgeState) renderAdvice(lastBridgeState);
}
async function loadHistory() {
  const response = await fetch(`/history?t=${encodeURIComponent(token)}`, { cache: "no-store" });
  if (!response.ok) throw new Error(`history HTTP ${response.status}`);
  const payload = await response.json();
  for (const item of payload.segments || []) applySegment(item);
  for (const item of payload.advice || []) applyAdvice(item);
}

// 上行电平：网关每秒 state 推送太慢，用 uplink_frames 差值近似显示活动
setInterval(() => {
  if (!UPLINK_PRODUCT_ENTRY_ENABLED) return;
  if (upFrames === lastUpFrames) meter($("mUp"), 0);
  lastUpFrames = upFrames;
}, 800);

async function initAudio() {
  if (!ctx) {
    ctx = new AudioContext({ sampleRate: 48000 });
    const mkUrl = js => URL.createObjectURL(new Blob([js], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(mkUrl(PLAYER_JS));
    if (UPLINK_PRODUCT_ENTRY_ENABLED) {
      await ctx.audioWorklet.addModule(mkUrl(CAP_JS));
    }
    playerNode = new AudioWorkletNode(ctx, "player", { outputChannelCount: [1] });
    playerNode.connect(ctx.destination);
  }
  await ctx.resume();
  if (!UPLINK_PRODUCT_ENTRY_ENABLED) return;
  if (!micOk) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      capNode = new AudioWorkletNode(ctx, "cap");
      ctx.createMediaStreamSource(micStream).connect(capNode);
      capNode.port.onmessage = e => {
        const i16 = new Int16Array(e.data);
        meter($("mUp"), serverMuted ? 0 : rmsInt16(i16));
        if (!serverMuted && ws && ws.readyState === 1) ws.send(e.data);
      };
      micOk = true;
    } catch (err) {
      micOk = false;  // 无麦/拒绝授权 → 收听/控制模式，不阻塞连接
    }
  }
}

async function connect() {
  wantConnected = true;
  setStatus("初始化音频…");
  await initAudio();
  setStatus("连接网关…");
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?t=${token}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { setStatus(summary());
    $("btnConn").textContent = "断开"; $("btnConn").classList.add("on");
    if (UPLINK_PRODUCT_ENTRY_ENABLED) $("btnMute").disabled = false;
    loadHistory().catch(err => { $("interpreterError").textContent = `历史补拉失败，实时流仍继续：${err.message}`; });
  };
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      const st = JSON.parse(e.data);
      if (st.type === "segment") {
        applySegment(st);
        return;
      }
      if (st.type === "advice") {
        applyAdvice(st);
        return;
      }
      if (st.type === "state") {
        lastBridgeState = st;
        serverMuted = !!st.muted;
        upFrames = st.uplink_frames || upFrames;
        renderMute();
        renderInterpreter(st);
        renderAdvice(st);
        const health = [
          st.link && `link=${st.link}`,
          st.reason,
          ...(st.alerts || [])
        ].filter(Boolean);
        const warning = (st.link !== "up" || (st.alerts || []).length)
          ? `\n⚠️ ${health.join(" | ")}`
          : "";
        setStatus(summary() + ` | 在线 ${st.clients}` + warning);
      }
      return;
    }
    const i16 = new Int16Array(e.data);
    meter($("mDown"), rmsInt16(i16));
    if ($("chkPlay").checked && playerNode) {
      const f32 = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
      playerNode.port.postMessage(f32.buffer, [f32.buffer]);
    }
  };
  ws.onclose = () => {
    $("btnConn").textContent = "连接"; $("btnConn").classList.remove("on");
    if (UPLINK_PRODUCT_ENTRY_ENABLED) $("btnMute").disabled = true;
    $("btnVoice").disabled = true;
    meter($("mDown"), 0);
    if (UPLINK_PRODUCT_ENTRY_ENABLED) meter($("mUp"), 0);
    renderInterpreter(null);
    renderAdvice(null);
    if (wantConnected) { setStatus("连接断开，3 秒后重连…"); retryTimer = setTimeout(connect, 3000); }
    else setStatus("未连接");
  };
  ws.onerror = () => {};
}

function disconnect() {
  wantConnected = false;
  clearTimeout(retryTimer);
  if (ws) ws.close();
}

$("btnConn").onclick = () => {
  if (wantConnected) disconnect();
  else connect().catch(err => setStatus("失败: " + err.message));
};
$("btnMute").onclick = () => {
  if (UPLINK_PRODUCT_ENTRY_ENABLED && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "mute", muted: !serverMuted }));
  }
};
$("btnVoice").onclick = () => {
  if (!voicePending && ws && ws.readyState === 1) {
    voicePending = true;
    $("btnVoice").disabled = true;
    ws.send(JSON.stringify({ type: "interpret_voice", enabled: !serverVoice }));
  }
};
// 「跟随最新」是两条泳道的共享状态：任一泳道上滚即整体暂停跟随。
for (const laneId of ["laneZh", "laneJa"]) {
  $(laneId).onscroll = () => {
    const lane = $(laneId);
    followLatest = lane.scrollHeight - lane.scrollTop - lane.clientHeight <= 24;
    renderFollowState();
  };
}
$("btnFollow").onclick = () => {
  followLatest = true;
  renderSegments();
};
$("btnMute").hidden = !UPLINK_PRODUCT_ENTRY_ENABLED;
$("uplinkMeter").hidden = !UPLINK_PRODUCT_ENTRY_ENABLED;
renderSegments();
</script>
</body>
</html>
